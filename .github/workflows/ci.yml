name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # core >= 0.11.0-rc.17 removed the first-login bootstrap secret: the node mints
  # its admin root key at `merod init` from these env vars, and enforces an
  # 8-char minimum password at creation (core#3081). The merod boot step
  # inherits this env, so the account exists before the node listens and the
  # e2e login (same creds, via MERO_E2E_USER/PASS) signs straight in. CI-only
  # values for an ephemeral node.
  MERO_AUTH_ADMIN_USER: dev
  MERO_AUTH_ADMIN_PASSWORD: dev-password

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify build artifacts
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint

  e2e:
    name: E2E (hooks vs released merod)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Download released merod
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo calimero-network/core --limit 1 --json tagName -q '.[0].tagName')
          URL=$(gh release view "$TAG" --repo calimero-network/core --json assets \
            -q '.assets[] | select(.name | test("merod_x86_64-unknown-linux-gnu\\.tar\\.gz$")) | .url')
          test -n "$URL" || { echo "no merod linux asset on release $TAG"; exit 1; }
          echo "Downloading merod from $TAG"
          curl -sL "$URL" | tar xz
          chmod +x ./merod
      - name: Boot merod (embedded auth, single node)
        run: |
          ./merod --home ./e2e-node --node e2e init \
            --server-port 4001 --swarm-port 4002 --auth-mode embedded
          ./merod --home ./e2e-node --node e2e run > merod.log 2>&1 &
          echo $! > merod.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4001/admin-api/health >/dev/null 2>&1 && { echo "merod healthy"; break; }
            sleep 2
            [ "$i" = "30" ] && { echo "merod did not become healthy"; exit 1; }
          done
      # The harness self-provisions (installs kv-store if absent) and reads
      # NODE_URL / MERO_E2E_USER, so no manual token/install bootstrapping needed.
      - name: Run hook integration tests against released merod
        env:
          NODE_URL: http://localhost:4001
          MERO_E2E_USER: dev
          MERO_E2E_PASS: dev-password
          NO_COLOR: '1'
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee e2e.log
          # Guard against a vacuous/all-skipped green: require at least one passing test.
          grep -qE "[1-9][0-9]* passed" e2e.log \
            || { echo "::error::e2e produced no passing tests — refusing a vacuous pass"; exit 1; }
      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e.log
            merod.log
      - name: Stop merod
        if: always()
        run: kill "$(cat merod.pid 2>/dev/null)" 2>/dev/null || true
